<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 이북 서재</title>
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--text:#1c2430;--muted:#6b7684;--line:#e3e8ee;
  --accent:#1e9eff;--accent-ink:#fff;--good:#18a058;--warn:#f0a020;--danger:#d03050;
  --shadow:0 1px 3px rgba(20,30,50,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12161c;--card:#1b212a;--text:#e8edf3;--muted:#8f9bab;--line:#2a323d;--shadow:none}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0}
h1 small{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:13px}
.sum{margin-bottom:22px}
.sum-tabs{display:flex;align-items:center;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sum-tabs .st{border:0;background:transparent;font-size:15px;color:var(--muted);padding:4px 10px;border-radius:16px;cursor:pointer}
.sum-tabs .st.on{background:#1E9EFF;color:#fff}
.sum-tabs select{margin-left:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 0;border-bottom:1px solid var(--line)}
.sum-row div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 4px;min-width:0}
.sum-row div+div{border-left:1px solid var(--line)}
.sum-row span{color:var(--muted);font-size:13px}
.sum-row b{font-size:clamp(14px,3.9vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:520px){.sum-row{grid-template-columns:repeat(2,1fr);gap:14px 0}.sum-row div:nth-child(odd){border-left:0}.sum-row div:nth-child(n+3){border-top:1px solid var(--line);padding-top:14px}}
.goal{background:var(--card);border-radius:12px;padding:14px;margin-bottom:20px;box-shadow:var(--shadow)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tools input[type=search]{flex:1;min-width:160px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 14px;cursor:pointer}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:grid;gap:10px}
.book{background:var(--card);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.book h3{margin:0;font-size:16px}
.book h3 .meta{font-weight:400;font-size:13px;margin-left:10px}
.meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;border-radius:10px;padding:1px 9px;color:#fff;margin-right:6px}
.tag.dropped{background:var(--danger)}.tag.reading{background:var(--warn)}.tag.done{background:var(--good)}.tag.wish{background:var(--muted)}
.stars{color:var(--warn);letter-spacing:1px}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px}
.alb{display:block;text-decoration:none;color:inherit;min-width:0}
.alb .cover{position:relative;aspect-ratio:2/3;background:var(--line);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.alb .cover .ph{padding:8px;text-align:center;font-size:12px;color:var(--muted);word-break:keep-all}
.alb .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.alb .at{margin-top:8px;font-weight:700;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alb .aa{color:var(--muted);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb .stars{font-size:12px;margin-top:2px}
.alb:hover .at{color:var(--accent)}
.memo{grid-column:1/-1;white-space:pre-wrap;font-size:14px;border-left:3px solid var(--line);padding-left:10px}
.acts{display:flex;gap:6px;align-items:flex-start}
.empty{text-align:center;color:var(--muted);padding:48px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(480px,94vw);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:20px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:4px}
.foot .btn{white-space:nowrap}
a{color:var(--accent)}
.tw{background:var(--card);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow)}
.tw-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tw-head select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.tw-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;margin-top:12px}
@media (max-width:720px){.tw-body{grid-template-columns:1fr}}
.tower{display:flex;flex-direction:column-reverse;align-items:center;width:100%;padding:8px 0 0}
.tower .floor{width:100%;height:8px;min-height:8px;background:var(--line);border-radius:4px;flex:none}
.tower .bk{flex:none;width:min(400px,90%);border-radius:8px;margin:0;line-height:1;color:#2b2b33;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tower a.bk{text-decoration:none;color:#2b2b33}
.tower a.bk:hover{opacity:.85}
a.ttl{color:inherit;text-decoration:none}
a.ttl:hover{color:var(--accent);text-decoration:underline}
.tower a.bk.drop{text-decoration:line-through}
.tower .bk.part{opacity:.65;border:2px dashed rgba(0,0,0,.35)}
.rd{text-align:center;color:#1E9EFF;padding:8px 0 29px;width:100%}
.rd,.hovg{transition:transform .18s ease;cursor:default}
.rd{transform-origin:center bottom}
.rd:hover{transform:scale(1.07)}
.hovg{width:fit-content;transform-origin:left center}
.hovg:hover{transform:scale(1.15)}
.hovg.graph{width:100%;transform-origin:center;margin-top:15px;padding-top:16px}
.hovg.graph:hover{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){.rd,.hovg{transition:none}}
.rd-num{font-size:24px;font-weight:700;line-height:1.3}
.rd-msg{font-size:14px;margin-top:2px}
.tw-info b{font-size:20px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:90px}
.mcol{height:100%;display:flex;align-items:flex-end;cursor:pointer}
.mbar{width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative;opacity:.85}
.mbar span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}
.mcol:hover .mbar{opacity:1}
.mcol.sel .mbar{background:#0a6fc9;opacity:1}
.mlab span{cursor:pointer}
.mlab span.sel{color:var(--accent);font-weight:700}
/* 월별 캘린더 */
.cal{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-head .btn{margin-left:auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .wd{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.cd{min-height:64px;padding:2px;min-width:0}
.cd .dn{font-size:11px;color:var(--muted)}
.cd.has .dn{color:var(--text);font-weight:700}
.cv{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.cc{position:relative;display:block;aspect-ratio:2/3;background:var(--line);border-radius:4px;overflow:hidden;width:86%;text-decoration:none}
.cv.n2 .cc,.cv.n3 .cc,.cv.n4 .cc{width:calc(50% - 1px)}
.cc .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:3px;text-align:center;font-size:9px;line-height:1.2;color:var(--muted);word-break:keep-all}
.cc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cc:hover{outline:2px solid var(--accent)}
.imgprev{position:relative;width:120px;aspect-ratio:2/3;background:var(--line);border-radius:6px;overflow:hidden;margin:0 auto;display:flex;align-items:center;justify-content:center}
.imgprev span{padding:6px;text-align:center;font-size:12px;color:var(--muted)}
.imgprev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center}
@media (max-width:600px){.tw-body{grid-template-columns:1fr}}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.book{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 나의 이북 서재<small>Ridibooks 독서기록</small></h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <span class="meta" id="who"></span>
      <button class="btn ghost sm" id="logout" hidden>로그아웃</button>
      <button class="btn ghost sm" id="export">내보내기</button>
      <button class="btn ghost sm" id="import">가져오기</button>
      <input type="file" id="file" accept="application/json" hidden>
      <button class="btn" id="add">+ 책 추가</button>
    </div>
  </header>

  <section class="goal" id="auth" hidden>
    <b>로그인이 필요해요</b>
    <div class="meta">이메일로 가입하면 어느 기기에서든 같은 기록을 볼 수 있어요.</div>
    <form id="authform" onsubmit="return false" style="padding:12px 0 0">
      <label>이메일<input type="email" id="email" autocomplete="email" required></label>
      <label>비밀번호 (6자 이상)<input type="password" id="pw" autocomplete="current-password" minlength="6" required></label>
      <div class="foot" style="justify-content:flex-start">
        <button class="btn" id="signin">로그인</button>
        <button class="btn ghost" id="signup">가입</button>
      </div>
      <div class="meta" id="authmsg"></div>
    </form>
  </section>
  <div id="app">
  <section class="sum" id="sum"></section>
  <section class="tw" id="tw"></section>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="제목·저자·메모 검색">
    <select id="sort">
      <option value="added">최근 추가</option>
      <option value="end">완독일</option>
      <option value="rating">별점</option>
      <option value="title">제목</option>
    </select>
    <select id="rate" hidden aria-label="별점 선택">
      <option value="all">전체 별점</option>
      <option value="5">★ 5점</option><option value="4">★ 4점</option><option value="3">★ 3점</option>
      <option value="2">★ 2점</option><option value="1">★ 1점</option>
    </select>
    <select id="view" aria-label="보기">
      <option value="list">보기: 리스트형</option>
      <option value="album">보기: 앨범형</option>
    </select>
  </div>
  <div class="list" id="list"></div>
  </div>
</div>

<dialog id="imgdlg">
  <form method="dialog" id="imgform">
    <div id="imgtitle" style="font-weight:700"></div>
    <div class="imgprev"><span id="imgph"></span><img id="imgprev" alt="" referrerpolicy="no-referrer" onload="this.style.display=''" onerror="this.style.display='none'"></div>
    <label>이미지 주소 · 리디북스 링크 · 책 번호<input id="imgin" placeholder="https://… 또는 https://ridibooks.com/books/…"></label>
    <div class="meta">이 날짜에만 적용돼요. 비우고 저장하면 기본 이미지로 돌아가요.</div>
    <div class="foot"><a class="btn ghost" id="imgopen" target="_blank" rel="noopener" style="text-decoration:none;margin-right:auto">작품 페이지 열기</a>
      <button type="button" class="btn ghost" id="imgcancel">취소</button><button type="submit" class="btn">저장</button></div>
  </form>
</dialog>
<dialog id="dlg">
  <form method="dialog" id="form">
    <label>리디북스 링크 또는 책 번호 (선택)<input name="ridi" placeholder="https://ridibooks.com/books/120040877"></label>
    <label>제목 *<input name="title" required></label>
    <div class="row">
      <label>저자<input name="author"></label>
      <label>상태
        <select name="status">
          <option value="reading">읽는 중</option>
          <option value="done">완독</option>
          <option value="dropped">하차</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>시작일<input type="date" name="start"></label>
      <label>완독일<input type="date" name="end"></label>
    </div>
    <label>책값 (원)<input type="number" name="price" min="0" step="1" placeholder="예: 10100"></label>
    <div class="row">
      <label>글자 수 (만자) · 책탑 높이<input type="number" name="chars" min="0" max="5000" step="any" placeholder="예: 42.5"></label>
      <label>권수<input type="number" name="volumes" min="0" max="500" placeholder="예: 3"></label>
    </div>
    <div class="row">
      <label>진행률 (%)<input type="number" name="progress" min="0" max="100" value="0"></label>
      <label>별점
        <select name="rating">
          <option value="0">없음</option>
          <option value="1">★</option><option value="2">★★</option><option value="3">★★★</option>
          <option value="4">★★★★</option><option value="5">★★★★★</option>
        </select>
      </label>
    </div>
    <label>메모 / 인상 깊은 구절<textarea name="memo" rows="4"></textarea></label>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">취소</button>
      <button type="submit" class="btn">저장</button>
    </div>
  </form>
</dialog>

<script>
function showErr(m){let b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';
  b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;background:#d03050;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;z-index:99';document.body.appendChild(b)}
  b.textContent='오류: '+m}
window.addEventListener('error',e=>showErr(e.message));
window.addEventListener('unhandledrejection',e=>showErr((e.reason&&e.reason.message)||String(e.reason)));
const KEY='ebook-log-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL={reading:'읽는 중',done:'완독',dropped:'하차',wish:'읽고 싶은 책'};
let books=[],tab='all',editId=null,user=null,sumMode='all';

// Supabase 설정: SB_KEY 에 Publishable(anon) 키를 넣으면 클라우드 저장, 비워 두면 브라우저 저장
const SB_URL='https://ooutcdzacyyxyamdqusi.supabase.co';
const SB_KEY='sb_publishable_fceSxguB_2MhelFvS470bQ_Uez77JRa';
const cloud=!SB_KEY.startsWith('PASTE');
const sb=cloud?supabase.createClient(SB_URL,SB_KEY):null;
const toRow=d=>({title:d.title,author:d.author||null,status:d.status,start_date:d.start||null,
  end_date:d.end||null,progress:d.progress||0,ridi:d.ridi||null,cover_days:(d.cvDays&&Object.keys(d.cvDays).length)?d.cvDays:null,price:d.price||0,chars:d.chars||0,volumes:d.volumes||0,rating:d.rating||0,memo:d.memo||null});
const fromRow=r=>({id:r.id,title:r.title,author:r.author||'',status:r.status,start:r.start_date||'',
  end:r.end_date||'',progress:r.progress,ridi:r.ridi||'',cvDays:r.cover_days||{},price:r.price||0,chars:+r.chars||0,volumes:r.volumes||0,rating:r.rating,memo:r.memo||''});

async function loadBooks(){
  if(!cloud){
    try{books=JSON.parse(localStorage.getItem(KEY))||[]}catch{books=[]}
    return;
  }
  const {data,error}=await sb.from('books').select('*');
  if(error){alert('불러오기 실패: '+error.message);books=[];return}
  books=data.map(fromRow);
}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch{}}
async function saveBook(d,id){
  if(!cloud){
    if(id) Object.assign(books.find(b=>b.id===id),d); else books.push({id:Date.now(),...d});
    return saveLocal();
  }
  const q=id?sb.from('books').update(toRow(d)).eq('id',id):sb.from('books').insert(toRow(d));
  const {error}=await q; if(error) alert('저장 실패: '+error.message);
  await loadBooks();
}
async function removeBook(id){
  if(!cloud){books=books.filter(b=>b.id!==id);return saveLocal()}
  const {error}=await sb.from('books').delete().eq('id',id);
  if(error) alert('삭제 실패: '+error.message);
  await loadBooks();
}
async function replaceAll(list){
  const key=x=>((x.title||'')+'|'+(x.author||'')).replace(/\s+/g,'').toLowerCase();
  const have=new Map(books.map(x=>[key(x),x]));
  const ins=[],ups=[];
  for(const it of list){
    const m=have.get(key(it));
    if(!m){ins.push(it);continue}
    // 이미 있는 책은 중복 추가하지 않고, 비어 있는 정보(리디 번호·글자 수·권수)만 채운다
    const merged={...m,ridi:m.ridi||it.ridi||'',price:m.price||it.price||0,chars:m.chars||it.chars||0,volumes:m.volumes||it.volumes||0};
    if(merged.ridi!==m.ridi||merged.price!==m.price||merged.chars!==m.chars||merged.volumes!==m.volumes) ups.push(merged);
  }
  if(!cloud){books=books.map(x=>ups.find(u=>u.id===x.id)||x).concat(ins.map((x,i)=>({id:Date.now()+i,...x})));saveLocal();alert(`추가 ${ins.length}권, 보완 ${ups.length}권`);return}
  for(let i=0;i<ins.length;i+=100){
    const {error}=await sb.from('books').insert(ins.slice(i,i+100).map(toRow));
    if(error){alert('가져오기 실패: '+error.message);break}
  }
  for(const u of ups){
    const {error}=await sb.from('books').update({ridi:u.ridi||null,price:u.price||0,chars:u.chars,volumes:u.volumes}).eq('id',u.id);
    if(error){alert('보완 실패: '+error.message);break}
  }
  alert(`추가 ${ins.length}권, 보완 ${ups.length}권`);
  await loadBooks();
}

const ridiUrl=b=>b.ridi
  ?`https://ridibooks.com/books/${encodeURIComponent(b.ridi)}`
  :`https://ridibooks.com/search?q=${encodeURIComponent(b.title)}`;

// 첫 화면 요약: 전체 / 연간 — 읽은 책(완독) 수, 책값, 읽은 글자 수
const yearsOf=()=>{const ys=new Set([new Date().getFullYear()]);books.forEach(b=>{const y=+(b.end||'').slice(0,4);if(y) ys.add(y)});return [...ys].sort((a,b)=>b-a)};
// 연도 드롭다운은 한 번만 만들고 그대로 둔다 (선택하는 순간 지우고 다시 만들면 일부 브라우저에서 꼬일 수 있음)
function fillYears(sel,years){
  const key=years.join(',');
  if(sel.dataset.ys!==key){sel.innerHTML=years.map(y=>`<option>${y}</option>`).join('');sel.dataset.ys=key}
  sel.value=String(towerYear);
}
let sumKey=null,sumRaf=0,sumTimer=0;
function renderStats(){
  const years=yearsOf(); if(!years.includes(towerYear)) towerYear=new Date().getFullYear();
  const done=books.filter(b=>b.status==='done'&&(sumMode==='all'||(b.end||'').startsWith(String(towerYear))));
  const price=done.reduce((a,b)=>a+(+b.price||0),0);
  const chars=done.reduce((a,b)=>a+estChars(b.chars,b.volumes),0);
  const vols=done.reduce((a,b)=>a+(+b.volumes||0),0);
  const box=$('#sum');
  if(!box.firstChild){
    box.innerHTML=`<div class="sum-tabs"><button class="st" data-m="all">전체</button><button class="st" data-m="year">연간</button><select id="sumyear" hidden></select></div><div class="sum-row"></div>`;
    box.querySelectorAll('.st').forEach(e=>e.onclick=()=>{sumMode=e.dataset.m;renderStats()});
    $('#sumyear').onchange=e=>{towerYear=+e.target.value;calMonth=null;render()};
  }
  box.querySelectorAll('.st').forEach(e=>e.classList.toggle('on',e.dataset.m===sumMode));
  const sy=$('#sumyear'); sy.hidden=sumMode!=='year'; fillYears(sy,years);
  const cells=[['읽은 책',done.length,'작품'],['읽은 권수',vols,'권'],['책값',price,'원'],['읽은 글자 수',Math.round(chars*10000),'자']];
  // 새로고침 직후나 전체/연간·연도가 바뀔 때만 0에서 올라가게 하고, 책을 고치거나 지울 때는 바로 값만 바꾼다
  const key=sumMode+(sumMode==='year'?towerYear:'');
  const animate=key!==sumKey&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
  sumKey=key;
  box.querySelector('.sum-row').innerHTML=cells.map(([l,n,u])=>`<div><span>${l}</span><b data-to="${n}" data-unit="${u}">${animate?0:n.toLocaleString()}${u}</b></div>`).join('');
  cancelAnimationFrame(sumRaf); clearTimeout(sumTimer);
  if(animate){
    const bs=[...box.querySelectorAll('.sum-row b')], t0=performance.now(), DUR=1100;
    bs.forEach(b=>{b.textContent='0'+b.dataset.unit});
    const tick=now=>{
      const p=Math.min(1,(now-t0)/DUR), e=1-Math.pow(1-p,3); // 처음엔 빠르게, 끝에서 천천히
      bs.forEach(b=>{b.textContent=Math.round(+b.dataset.to*e).toLocaleString()+b.dataset.unit});
      if(p<1) sumRaf=requestAnimationFrame(tick);
    };
    sumRaf=requestAnimationFrame(tick);
    // 화면이 백그라운드라서 애니메이션이 멈춰도 최종 값은 반드시 정확히 표시한다
    sumTimer=setTimeout(()=>bs.forEach(b=>{b.textContent=(+b.dataset.to).toLocaleString()+b.dataset.unit}),DUR+400);
  }
}

function renderTabs(){
  const t=[['all','전체'],['done','완독'],['dropped','하차']];
  $('#tabs').innerHTML=t.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(e=>e.onclick=()=>{tab=e.dataset.k;render()});
}

function renderList(){
  const q=$('#q').value.trim().toLowerCase(), s=$('#sort').value;
  $('#rate').hidden=s!=='rating';
  const rf=s==='rating'?$('#rate').value:'all';
  let l=books.filter(b=>(tab==='all'||b.status===tab)&&(rf==='all'||b.rating===+rf)&&
    (!q||[b.title,b.author,b.memo].some(x=>(x||'').toLowerCase().includes(q))));
  const cmp={
    added:(a,b)=>b.id-a.id,
    end:(a,b)=>(b.end||'').localeCompare(a.end||''),
    rating:(a,b)=>b.rating-a.rating,
    title:(a,b)=>a.title.localeCompare(b.title,'ko')
  }[s];
  l.sort(cmp);
  if(!l.length){$('#list').innerHTML='<div class="empty">기록된 책이 없어요. “+ 책 추가”로 시작해 보세요.</div>';return}
  const view=$('#view').value;
  $('#list').className=view==='album'?'album':'list';
  if(view==='album'){
    $('#list').innerHTML=l.map(b=>`<a class="alb" href="${ridiUrl(b)}" target="_blank" rel="noopener">
      <div class="cover"><span class="ph">${esc(b.title)}</span>${(b.cvDays&&b.cvDays[b.end])||b.ridi?`<img src="${esc((b.cvDays&&b.cvDays[b.end])||('https://img.ridicdn.net/cover/'+encodeURIComponent(b.ridi)+'/xxlarge'))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
      <div class="at">${esc(b.title)}</div>
      ${b.author?`<div class="aa">${esc(b.author)}</div>`:''}
      ${b.rating?`<div class="stars">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</div>`:''}
    </a>`).join('');
    return;
  }
  $('#list').innerHTML=l.map(b=>{
    return `<article class="book">
      <div>
        <h3><span class="tag ${b.status}">${LABEL[b.status]}</span><a class="ttl" href="${ridiUrl(b)}" target="_blank" rel="noopener">${esc(b.title)}</a>${b.author?`<span class="meta">${esc(b.author)}</span>`:''}${b.rating?`<span class="meta"><span class="stars">${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</span></span>`:''}</h3>
        ${b.status==='reading'?`<div class="bar"><i style="width:${b.progress||0}%"></i></div><div class="meta">${b.progress||0}% 읽음</div>`:''}
      </div>
      <div class="acts">
        <button class="btn ghost sm" data-edit="${b.id}">수정</button>
        <button class="btn danger sm" data-del="${b.id}">삭제</button>
      </div>
      ${b.memo?`<div class="memo">${esc(b.memo)}</div>`:''}
    </article>`}).join('');
  document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>openForm(+e.dataset.edit));
  document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{
    if(confirm('이 기록을 삭제할까요?')) removeBook(+e.dataset.del).then(render)
  });
}

// ── 책탑: 읽은 글자 수(만자)만큼 높이가 쌓이고, 높이에 따라 마스코트가 성장 ──
// 읽은 글자 수(만자) 구간별 한마디 — 위에서부터 처음 조건에 맞는 문구를 쓴다
const TIERS=[[5000,'경지에 도달한 ‘리디 Master’'],[4000,'상위 1%의 활자 중독자'],[3000,'밥은 챙겨 드시면서 읽으시죠?'],
  [2000,'대..대단합니다. 읽은 글자 2,000만 자 돌파!'],[1000,'단언컨대 이 정도면 어디 가서 책으로 꿀리진 않을 거예요.'],
  [0,'읽은 글자 수로는 아직 평균에 못 미쳐요ㅠ']];
const COLORS=['#EDCD95','#EDB899','#B8B5F2','#BAD6F6','#B8B8B8'];
// 책 한 권의 높이(px) = 12 + 글자 수(만자) × 0.4, 최소 14 · 최대 110.
// 글자 수가 비어 있으면 권수 × 11 을 만자로 추정한다 (한 권 평균 약 11.2만자).
const estChars=(chars,vol)=>chars>0?chars:(vol>0?vol*11:0);
function bookHeight(chars,vol){
  const m=estChars(chars,vol);
  return Math.min(110,Math.max(14,Math.round(12+m*0.4)));
}
let towerYear=new Date().getFullYear(), calMonth=null;
// 선택한 달의 완독 작품을 날짜별 캘린더로 보여 준다 (대표 이미지, 누르면 리디북스 책 페이지)
// 이미지 칸에는 이미지 주소, 리디북스 책 링크, 리디북스 책 번호 중 아무거나 붙여 넣을 수 있다
function coverUrl(v){
  v=String(v||'').trim(); if(!v) return '';
  const m=v.match(/ridibooks\.com\/books\/(\d+)/)||v.match(/^(\d{5,})$/);
  if(m) return 'https://img.ridicdn.net/cover/'+m[1]+'/xxlarge';
  return /^https?:\/\//i.test(v)?v:'';
}
// 시작일~완독일의 모든 날짜(YYYY-MM-DD). 시작일이 없거나 완독일보다 늦으면 완독일 하루
function spanDays(b){
  const e=b.end, s0=(b.start&&b.start<e)?b.start:e, out=[];
  const u=x=>Date.UTC(+x.slice(0,4),+x.slice(5,7)-1,+x.slice(8,10));
  for(let t=u(s0),te=u(e);t<=te&&out.length<400;t+=86400000){const d=new Date(t); out.push(d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'))}
  return out;
}
// 캘린더의 이미지를 누르면 열리는 '날짜별 이미지 바꾸기' 팝업
let imgCtx=null;
const defaultCover=(b,size)=>b.ridi?'https://img.ridicdn.net/cover/'+encodeURIComponent(b.ridi)+'/'+size:'';
function updPrev(){
  const b=books.find(x=>x.id===imgCtx.id); if(!b) return;
  const src=coverUrl($('#imgin').value)||defaultCover(b,'xxlarge'), im=$('#imgprev');
  $('#imgph').textContent=b.title; im.style.display=src?'':'none'; if(src) im.src=src;
}
function openImgDlg(id,date){
  const b=books.find(x=>x.id===id); if(!b) return; imgCtx={id,date};
  $('#imgtitle').textContent=b.title+' · '+date;
  $('#imgin').value=(b.cvDays&&b.cvDays[date])||'';
  $('#imgopen').href=ridiUrl(b); updPrev(); $('#imgdlg').showModal();
}
function calHTML(yr,mo){
  const days=new Date(yr,mo,0).getDate(), first=new Date(yr,mo-1,1).getDay(), pre=yr+'-'+String(mo).padStart(2,'0');
  const byDay={}; let total=0;
  // 읽은 기간(시작일~완독일) 동안 매일 표시한다. 시작일이 없거나 완독일보다 늦으면 완독일 하루만 표시한다
  books.filter(b=>b.status==='done'&&b.end).forEach(b=>{
    if(b.end.startsWith(pre)) total++;
    for(const date of spanDays(b)) if(date.startsWith(pre)){const d=+date.slice(8,10); (byDay[d]=byDay[d]||[]).push({b,date})}
  });
  let cells='<div class="wd">일</div><div class="wd">월</div><div class="wd">화</div><div class="wd">수</div><div class="wd">목</div><div class="wd">금</div><div class="wd">토</div>';
  for(let i=0;i<first;i++) cells+='<div class="cd empty"></div>';
  for(let d=1;d<=days;d++){
    const l=byDay[d]||[];
    cells+=`<div class="cd ${l.length?'has':''}"><span class="dn">${d}</span><div class="cv n${Math.min(l.length,4)}">${l.map(({b,date})=>{
      // 시작일/완독일에 직접 지정한 이미지가 있으면 그것을, 없으면 리디북스 기본 대표 이미지를 쓴다
      const own=(b.cvDays||{})[date], src=own||(b.ridi?'https://img.ridicdn.net/cover/'+encodeURIComponent(b.ridi)+'/large':'');
      return `<a class="cc" href="#" data-b="${b.id}" data-d="${date}" title="${esc(b.title)} · 누르면 이미지 바꾸기"><span class="ph">${esc(b.title)}</span>${src?`<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</a>`}).join('')}</div></div>`;
  }
  return `<div class="cal"><div class="cal-head"><b>${yr}년 ${mo}월</b><span class="meta">완독 ${total}작품</span><button class="btn ghost sm" id="calclose">닫기</button></div><div class="cal-grid">${cells}</div></div>`;
}
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
function towerItems(yr){
  const out=[];
  for(const b of books){
    const pg=estChars(b.chars,b.volumes);
    if(b.status==='done'&&(b.end||'').startsWith(yr)) out.push({b,pages:pg,part:false,at:b.end});
    else if(b.status==='dropped'&&(b.end||'').startsWith(yr)) out.push({b,pages:pg,part:false,drop:true,at:b.end});
    else if(b.status==='reading'&&estChars(b.chars,b.volumes)>0&&(b.start?b.start.startsWith(yr):yr===new Date().getFullYear())){
      const read=Math.round(estChars(b.chars,b.volumes)*(b.progress||0))/100;
      if(read>0) out.push({b,pages:read,part:true,at:b.start||''});
    }
  }
  return out.sort((x,y)=>x.at.localeCompare(y.at)||x.b.id-y.b.id);
}
function renderTower(){
  const now=new Date().getFullYear();
  const ys=new Set([now]);
  books.forEach(b=>{for(const d of [b.end,b.start]) if(d&&+d.slice(0,4)) ys.add(+d.slice(0,4))});
  const years=[...ys].sort((a,b)=>b-a);
  if(!ys.has(towerYear)) towerYear=now;
  const items=towerItems(String(towerYear));
  const total=items.filter(i=>!i.drop).reduce((a,i)=>a+i.pages,0);
  const tier=TIERS.find(t=>total>=t[0]);
  const doneCount=items.filter(i=>!i.part&&!i.drop).length;
  const mc=Array(12).fill(0);
  items.filter(i=>!i.part&&!i.drop).forEach(i=>{const m=+(i.at||'').slice(5,7);if(m>=1&&m<=12) mc[m-1]++});
  const mx=Math.max(1,...mc);
  let prevColor=-1;
  const stack=items.map((i,k)=>{
    const h=i.part?bookHeight(i.pages,0):bookHeight(i.b.chars,i.b.volumes);
    const off=(hash(i.b.title+k)%33)-16; // 너비는 모두 같고, 좌우로 살짝 어긋나게 쌓는다 (±16px)
    let ci=hash(i.b.title)%COLORS.length; if(ci===prevColor) ci=(ci+1)%COLORS.length; prevColor=ci; // 바로 옆 책과 같은 색이 겹치지 않게
    const c=COLORS[ci];
    return `<a class="bk ${i.part?'part':''} ${i.drop?'drop':''}" href="${ridiUrl(i.b)}" target="_blank" rel="noopener" data-h="${h}" style="height:${h}px;background:${c};transform:translateX(${off}px)"
      title="${esc(i.b.title)} · ${Math.round(i.pages*10)/10}만자${i.part?' (읽는 중)':''}${i.drop?' (하차)':''}">${esc(i.b.title)}</a>`;
  }).join('');
  const tw=$('#tw');
  if(!tw.firstChild){
    tw.innerHTML=`<div class="tw-head"><b id="twtitle"></b><select id="twyear"></select></div><div id="twbody"></div>`;
    $('#twyear').onchange=e=>{towerYear=+e.target.value;calMonth=null;renderStats();renderTower()};
  }
  $('#twtitle').textContent=`${towerYear}년 책탑`; fillYears($('#twyear'),years);
  $('#twbody').innerHTML=`
    <div class="tw-body">
      <div class="tower"><div class="floor"></div>${stack}<div class="rd"><div class="rd-num">${Math.round(total).toLocaleString()} 만자</div><div class="rd-msg">${tier[1]}</div></div></div>
      <div class="tw-info">
        <div class="hovg">
          <div class="meta">${towerYear}년 완독 <b>${doneCount}작품</b></div>
          <div class="meta">월별 완독 작품</div>
        </div>
        <div class="hovg graph">
          <div class="months">${mc.map((n,i)=>`<div class="mcol ${calMonth===i+1?'sel':''}" data-m="${i+1}" title="${i+1}월 ${n}작품 · 누르면 캘린더로 보기"><div class="mbar" style="height:${Math.round(n/mx*100)}%"><span>${n||''}</span></div></div>`).join('')}</div>
          <div class="mlab">${mc.map((_,i)=>`<span class="${calMonth===i+1?'sel':''}" data-m="${i+1}">${i+1}</span>`).join('')}</div>
        </div>
        ${calMonth?calHTML(towerYear,calMonth):''}
      </div>
    </div>`;
  document.querySelectorAll('#twbody [data-m]').forEach(e=>e.onclick=()=>{
    calMonth=calMonth===+e.dataset.m?null:+e.dataset.m; renderTower();
    const c=document.querySelector('.cal'); if(c) c.scrollIntoView({block:'nearest',behavior:'smooth'});
  });
  const cc=$('#calclose'); if(cc) cc.onclick=()=>{calMonth=null;renderTower()};
  document.querySelectorAll('.cal .cc').forEach(a=>a.onclick=e=>{e.preventDefault();openImgDlg(+a.dataset.b,a.dataset.d)});
  // 높이는 규칙대로 고정하고, 제목이 한 줄에 다 들어가도록 글자 크기를 책 높이·너비에 맞춘다
  document.querySelectorAll('.tower a.bk').forEach(a=>{
    let fs=Math.max(8,Math.min(13,(+a.dataset.h)-4)); a.style.fontSize=fs+'px';
    while(a.scrollWidth>a.clientWidth&&fs>8){fs-=0.5;a.style.fontSize=fs+'px'}
  });
}
function render(){renderStats();renderTower();renderTabs();renderList()}

function openForm(id){
  editId=id||null;
  const f=$('#form'); f.reset();
  if(id){
    const b=books.find(x=>x.id===id);
    for(const k of ['title','author','status','start','end','progress','ridi','price','chars','volumes','rating','memo']) f.elements[k].value=b[k]??'';
    if(!f.elements.start.value&&f.elements.end.value) f.elements.start.value=f.elements.end.value; // 시작일 = 읽은 날
  }
  $('#dlg').showModal();
}
$('#add').onclick=()=>openForm();
$('#cancel').onclick=()=>$('#dlg').close();
$('#form').onsubmit=async()=>{
  const d=Object.fromEntries(new FormData($('#form')));
  d.cvDays=editId?((books.find(x=>x.id===editId)||{}).cvDays||{}):{};   // 날짜별 이미지는 수정창에서 지워지지 않게 그대로 보존
  d.ridi=(String(d.ridi||'').match(/books\/(\d+)/)||String(d.ridi||'').match(/^\s*(\d+)\s*$/)||[,''])[1];
  d.rating=+d.rating; d.price=Math.max(0,parseInt(d.price)||0); d.chars=Math.max(0,+d.chars||0); d.volumes=Math.max(0,parseInt(d.volumes)||0); d.progress=Math.max(0,Math.min(100,+d.progress||0));
  if(d.status==='done'){d.progress=100; if(!d.end) d.end=new Date().toISOString().slice(0,10)}
  if(!d.start&&d.end) d.start=d.end;
  await saveBook(d,editId);render();
};
try{const v=localStorage.getItem('ebook-view'); if(v==='album'||v==='list') $('#view').value=v}catch{}
$('#imgin').oninput=()=>imgCtx&&updPrev(); $('#imgcancel').onclick=()=>$('#imgdlg').close();
$('#imgform').onsubmit=async()=>{

$('#q').oninput=renderList; $('#sort').onchange=renderList; $('#rate').onchange=renderList;
$('#view').onchange=()=>{try{localStorage.setItem('ebook-view',$('#view').value)}catch{}renderList()};

async function start(){
  if(cloud){
    const {data}=await sb.auth.getSession();
    user=data.session?.user||null;
    sb.auth.onAuthStateChange((_e,s)=>{const u=s?.user||null;if((u&&u.id)!==(user&&user.id)){user=u;start()}});
  }
  const needLogin=cloud&&!user;
  $('#auth').hidden=!needLogin; $('#app').hidden=needLogin;
  $('#add').hidden=$('#export').hidden=$('#import').hidden=needLogin;
  $('#logout').hidden=!user; $('#who').textContent=user?user.email:'';
  if(!needLogin){await loadBooks();render()}
}
async function authDo(kind){
  const email=$('#email').value.trim(), password=$('#pw').value;
  if(!email||password.length<6){$('#authmsg').textContent='이메일과 6자 이상의 비밀번호를 입력하세요.';return}
  const {data,error}=kind==='up'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
  if(error){$('#authmsg').textContent=error.message;return}
  if(kind==='up'&&!data.session) $('#authmsg').textContent='가입 완료! 이메일 인증 메일을 확인한 뒤 로그인하세요.';
}
if(cloud){
  $('#signin').onclick=()=>authDo('in'); $('#signup').onclick=()=>authDo('up');
  $('#logout').onclick=()=>sb.auth.signOut();
}
start();
</script>
</body>
</html>
